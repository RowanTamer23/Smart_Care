name: smart_care
description: Smart-Care Medical App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  smooth_page_indicator: ^1.1.0
  flutter_svg: ^2.0.9
  dartz: ^0.10.1
  supabase_flutter: ^2.0.0
  flutter_bloc: ^8.1.3
  dio: ^5.9.2
  shared_preferences: ^2.5.5
  get_it: ^8.0.0
  image_picker: ^1.1.2
  file_picker: ^10.3.8
  zego_uikit_prebuilt_call: ^4.24.2
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.2
  google_maps_flutter: ^2.17.1
  geolocator: ^14.0.2
  url_launcher: ^6.3.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  path_provider_foundation: 2.5.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/hero.jpg"
  remove_alpha_ios: true
